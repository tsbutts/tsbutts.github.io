  <main>
    <h2>Contact us</h2>
    <p>Questions, suggestions or corrections? Send us a message.</p>
    <form action="#" method="post">
      <p><label for="name">Name</label><br>
         <input type="text" id="name" name="name" required></p>
      <p><label for="email">Email</label><br>
         <input type="email" id="email" name="email" required></p>
      <p><label for="topic">Topic</label><br>
         <select id="topic" name="topic">
           <option>General question</option>
           <option>Suggest content</option>
           <option>Report a problem</option>
         </select></p>
      <p><label for="message">Message</label><br>
         <textarea id="message" name="message" rows="6" required></textarea></p>
      <button type="submit">Send message</button>
    </form>
    <p>Email: <a href="tsbutts@go.olemiss.edu">tsbutts@go.olemiss.edu</a></p>
  </main>
  <footer>
    <p>2026 Trevor Butts</p>
    <p><a href="contact.html">Contact us</a></p>
  </footer>
