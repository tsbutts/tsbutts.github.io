<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="author" content="Trevor Butts">
  <meta name="description" content="Choose a category of art, then a medium, and read about how people have used it to express themselves.">
  <title>Explore | Art History: Media of Expression</title>
  <link rel="icon" href="images/favicon.png" type="image/png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to main content</a>
  <header>
    <div>
      <p class="site-title">Art History: Media of Expression</p>
      <button class="login-btn" id="changePwBtn" type="button" hidden>Change password</button>
      <button class="login-btn" id="authBtn" type="button">Log in</button>
    </div>
    <nav aria-label="Main">
      <ul>
        <li><a href="index.html">Home</a></li>
        <li class="protected"><a href="explore.html" aria-current="page">Explore</a></li>
        <li class="protected"><a href="about.html">About</a></li>
        <li class="protected"><a href="contact.html">Contact</a></li>
      </ul>
    </nav>
  </header>

  <main id="main">
    <h1 class="visually-hidden">Explore art media</h1>

    <!-- Announces each step change to screen readers -->
    <p id="exploreStatus" class="visually-hidden" role="status" aria-live="polite"></p>

    <!-- All three steps are rendered into this container by js/explore.js -->
    <div id="exploreView"></div>

    <noscript>
      <p>This page needs JavaScript to show the art categories. Please turn it on and reload.</p>
    </noscr
  </main>

  <footer>
    <p>&copy; 2026 Trevor Butts</p>
    <p><a href="contact.html">Contact us</a></p>
  </footer>
  <dialog id="authDialog" aria-labelledby="authTitle">
      <div class="auth-box">
        <button type="button" class="auth-close" id="authClose" aria-label="Close dialog">&times;</button>
        <h2 id="authTitle" tabindex="-1">Log in</h2>
        <p id="authHelp">Log in to explore the collection.</p>

        <p id="authError" class="auth-error" role="alert"></p>
        <p id="authSuccess" class="auth-success" role="status"></p>
        <div id="authSpinner" class="loading" role="status" hidden>
          <span class="spinner" aria-hidden="true"></span>
          <p>Working...</p>
        </div>

        <form id="loginForm">
          <label for="loginEmail">Email</label>
          <input id="loginEmail" type="email" autocomplete="email" required>
          <label for="loginPassword">Password</label>
          <input id="loginPassword" type="password" autocomplete="current-password" required>
          <button class="btn" type="submit">Log in</button>
          <button class="link-btn" type="button" id="showSignup">Need an account? Sign up</button>
        </form>

        <form id="signupForm" hidden>
          <label for="signupEmail">Email</label>
          <input id="signupEmail" type="email" autocomplete="email" required>
          <label for="signupPassword">Password (at least 6 characters)</label>
          <input id="signupPassword" type="password" autocomplete="new-password" minlength="6" required>
          <label for="signupConfirm">Confirm password</label>
          <input id="signupConfirm" type="password" autocomplete="new-password" required>
          <button class="btn" type="submit">Create account</button>
          <button class="link-btn" type="button" id="showLogin">Already have an account? Log in</button>
        </form>

        <form id="changePwForm" hidden>
          <label for="currentPassword">Current password</label>
          <input id="currentPassword" type="password" autocomplete="current-password" required>
          <label for="newPassword">New password (at least 6 characters)</label>
          <input id="newPassword" type="password" autocomplete="new-password" minlength="6" required>
          <button class="btn" type="submit">Change password</button>
        </form>
      </div>
    </dialog>
  <script type="module" src="js/auth.js"></script>
  <script type="module" src="js/explore.js"></script>
</body>
</html>
